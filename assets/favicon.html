
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cellular Butterfly</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
  }
  body {
    display: grid;
    place-items: center;
  }
  svg {
    width: min(96vw, 1100px);
    height: auto;
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>

<svg id="butterfly"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 760"
     role="img"
     aria-label="cellular butterfly with dense veins">

<defs>
  <g id="wing">
    <!-- continuous anatomical wing boundary -->
    <path id="silhouette" d="
      M 0,0
      C -18,-46 -55,-111 -112,-164
      C -165,-213 -231,-245 -286,-226
      C -331,-211 -347,-170 -321,-132
      C -301,-103 -266,-85 -232,-65
      C -201,-46 -180,-25 -163,0
      C -210,-8 -258,5 -292,37
      C -323,67 -324,111 -295,137
      C -267,164 -228,158 -200,138
      C -167,114 -146,82 -124,57
      C -93,23 -48,5 0,0 Z"
      fill="none"/>

    <clipPath id="wingClip">
      <use href="#silhouette" fill="white"/>
    </clipPath>

    <!-- Fine packed hexagonal cellular lattice -->
    <g clip-path="url(#wingClip)"
       fill="none"
       stroke="#A51F39"
       stroke-width="0.95"
       stroke-opacity="0.78">

      <path id="cellRows" d=""/>

    </g>

    <!-- Primary branching veins -->
    <g fill="none"
       stroke="#8D1730"
       stroke-width="2.2"
       stroke-linecap="round"
       stroke-linejoin="round">

      <path d="M 0,0
        C -65,-36 -124,-84 -174,-133
        C -216,-175 -257,-208 -294,-216"/>

      <path d="M -17,-12
        C -63,-78 -101,-140 -129,-181
        C -153,-213 -180,-232 -212,-237"/>

      <path d="M -42,-22
        C -92,-36 -151,-47 -201,-66
        C -248,-84 -284,-107 -319,-133"/>

      <path d="M -78,-25
        C -122,-11 -171,-3 -211,-8
        C -251,-12 -279,-27 -302,-49"/>

      <path d="M -111,-20
        C -152,-4 -189,20 -220,49
        C -247,74 -267,104 -286,129"/>

      <path d="M -38,-20
        C -72,3 -102,26 -125,53
        C -152,85 -170,113 -198,138"/>

      <path d="M -85,-23
        C -103,6 -112,33 -117,59
        C -124,88 -135,112 -153,130"/>

      <path d="M -156,-119
        C -173,-98 -190,-82 -211,-66"/>

      <path d="M -201,-66
        C -198,-46 -204,-26 -211,-8"/>

      <path d="M -211,-8
        C -206,12 -205,30 -220,49"/>

      <path d="M -129,-181
        C -151,-160 -164,-144 -174,-133"/>

      <path d="M -174,-133
        C -193,-130 -218,-128 -238,-119"/>

      <path d="M -238,-119
        C -264,-120 -290,-127 -319,-133"/>

      <path d="M -112,-164
        C -132,-137 -143,-113 -156,-94"/>

      <path d="M -156,-94
        C -180,-88 -202,-87 -232,-85"/>

      <path d="M -232,-85
        C -263,-83 -291,-96 -311,-114"/>

      <path d="M -124,57
        C -145,38 -166,26 -190,20"/>

      <path d="M -190,20
        C -216,23 -239,33 -257,50"/>

      <path d="M -257,50
        C -279,72 -294,98 -295,121"/>

      <path d="M -163,0
        C -178,31 -184,61 -180,86"/>

      <path d="M -180,86
        C -187,108 -197,127 -215,145"/>

    </g>
  </g>
</defs>

<!-- White is deliberately NOT used as a background. -->
<g id="artwork" fill="none">

  <!-- Mirror the anatomical wing mesh -->
  <g transform="translate(600 374)">
    <use href="#wing"/>
    <use href="#wing" transform="scale(-1 1)"/>
  </g>

  <!-- Body -->
  <g stroke="#8D1730" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 327
             C594 346 595 373 600 400
             C604 420 602 443 600 456"
          stroke-width="5"/>

    <path d="M600 335
             C586 316 575 309 563 307
             M600 335
             C614 316 625 309 637 307"
          stroke-width="1.8"/>

    <path d="M600 399
             C588 394 586 387 588 379
             M600 399
             C612 394 614 387 612 379"
          stroke-width="1.4"/>

    <path d="M595 350 L605 350
             M595 361 L605 361
             M595 372 L605 372
             M596 383 L604 383
             M597 394 L603 394
             M598 405 L602 405
             M598 416 L602 416"
          stroke-width="1.2"/>

    <path d="M598 329
             C581 306 574 287 577 274
             C580 264 587 261 591 267"
          stroke-width="1.4"/>

    <path d="M602 329
             C619 306 626 287 623 274
             C620 264 613 261 609 267"
          stroke-width="1.4"/>
  </g>
</g>
</svg>

<script>
(() => {
  const svg = document.getElementById("butterfly");
  const NS = "http://www.w3.org/2000/svg";

  // Build a dense staggered hexagonal cell lattice.
  // Cells are clipped to the wing silhouette.
  const defs = svg.querySelector("defs");
  const clip = defs.querySelector("#wingClip");
  const lattice = defs.querySelector("#cellRows");

  const points = [
    [0, 0], [-18,-46], [-55,-111], [-112,-164],
    [-165,-213], [-231,-245], [-286,-226],
    [-331,-211], [-347,-170], [-321,-132],
    [-301,-103], [-266,-85], [-232,-65],
    [-201,-46], [-180,-25], [-163,0],
    [-210,-8], [-258,5], [-292,37],
    [-323,67], [-324,111], [-295,137],
    [-267,164], [-228,158], [-200,138],
    [-167,114], [-146,82], [-124,57],
    [-93,23], [-48,5]
  ];

  // Evenly packed, slightly elongated polygonal cells.
  const stepX = 10.5;
  const stepY = 9.2;
  const cellLayer = document.createElementNS(NS, "g");
  cellLayer.setAttribute("clip-path", "url(#wingClip)");
  cellLayer.setAttribute("fill", "none");
  cellLayer.setAttribute("stroke", "#A51F39");
  cellLayer.setAttribute("stroke-width", "0.85");
  cellLayer.setAttribute("stroke-opacity", "0.82");

  function inside(x, y) {
    let result = false;
    for (let i = 0, j = points.length - 1;
         i < points.length; j = i++) {
      const [xi, yi] = points[i];
      const [xj, yj] = points[j];
      const cross = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) /
        ((yj - yi) || 1e-8) + xi);
      if (cross) result = !result;
    }
    return result;
  }

  function hash(x, y) {
    const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return v - Math.floor(v);
  }

  for (let row = -29; row <= 19; row++) {
    for (let col = -36; col <= 2; col++) {
      const cx = col * stepX + (row & 1) * stepX / 2;
      const cy = row * stepY;

      if (!inside(cx, cy)) continue;

      const jitterX = (hash(col, row) - 0.5) * 2.0;
      const jitterY = (hash(row, col) - 0.5) * 1.7;
      const rx = 5.3 + hash(col + 4, row) * 1.1;
      const ry = 4.4 + hash(col, row + 3) * 0.8;

      const verts = [];
      for (let k = 0; k < 6; k++) {
        const angle = Math.PI / 3 * k + Math.PI / 6;
        const x = cx + jitterX + Math.cos(angle) * rx;
        const y = cy + jitterY + Math.sin(angle) * ry;
        verts.push(`${x.toFixed(2)},${y.toFixed(2)}`);
      }

      const polygon = document.createElementNS(NS, "polygon");
      polygon.setAttribute("points", verts.join(" "));
      cellLayer.appendChild(polygon);
    }
  }

  // Insert the cellular mesh behind the major veins.
  const wing = defs.querySelector("#wing");
  wing.insertBefore(cellLayer, wing.children[2]);

  // Refine the outline and vein appearance with finer branching.
  const fine = document.createElementNS(NS, "g");
  fine.setAttribute("clip-path", "url(#wingClip)");
  fine.setAttribute("fill", "none");
  fine.setAttribute("stroke", "#9C1C36");
  fine.setAttribute("stroke-width", "0.95");
  fine.setAttribute("stroke-linecap", "round");

  // Vein branches connect anatomical trunks to the cell lattice.
  for (let i = 0; i < 11; i++) {
    const y = -204 + i * 27;
    const startX = -20 - i * 8;
    const endX = -300 + i * 5;

    for (let j = 0; j < 3; j++) {
      const yy = y + j * 8;
      const midX = (startX + endX) / 2;
      const midY = yy - 13 + j * 3;

      const path = document.createElementNS(NS, "path");
      path.setAttribute("d",
        `M ${startX} ${yy}
         Q ${midX} ${midY} ${endX} ${yy + 13}`);
      path.setAttribute("stroke-opacity", "0.7");
      fine.appendChild(path);
    }
  }

  wing.appendChild(fine);


  svg.addEventListener("click", () => {
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", NS);
    clone.setAttribute("width", "1200");
    clone.setAttribute("height", "760");

    clone.removeAttribute("role");
    clone.removeAttribute("aria-label");

    const source =
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      new XMLSerializer().serializeToString(clone);

    const blob = new Blob([source], {
      type: "image/svg+xml;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cellular-butterfly.svg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
})();
</script>

</body>
</html>
